<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo Secreto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f0; --surface:#ffffff; --ink:#17181a; --muted:#7a7a78;
  --line:#e3dfd8; --accent:#b4453c; --accent-soft:#f3e4e2; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121213; --surface:#1b1c1e; --ink:#ececea; --muted:#9a9a97;
    --line:#2d2e31; --accent:#e0776c; --accent-soft:#2a1f1e; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#121213; --surface:#1b1c1e; --ink:#ececea; --muted:#9a9a97;
  --line:#2d2e31; --accent:#e0776c; --accent-soft:#2a1f1e; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.wrap{max-width:720px;margin:0 auto;padding:40px 20px 80px}
header{text-align:center;margin-bottom:34px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(28px,6vw,40px);margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:8px}
textarea,input[type=text]{
  width:100%;font-family:inherit;font-size:15px;color:var(--ink);
  background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;transition:border-color .15s;
}
textarea{min-height:110px;resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;margin-top:12px}
.row input{flex:1}
button{
  font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:11px 16px;border-radius:10px;transition:.15s;
}
button:hover{border-color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;width:100%;margin-top:16px;padding:13px;font-weight:600}
button.primary:hover{filter:brightness(1.07)}
button.primary:disabled{opacity:.4;cursor:not-allowed;filter:none}
button.ghost{background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;min-height:4px}
.chip{
  display:inline-flex;align-items:center;gap:7px;background:var(--bg);
  border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;font-size:14px;
}
.chip button{all:unset;cursor:pointer;color:var(--muted);line-height:1;font-size:16px;padding:0 4px;border-radius:50%}
.chip button:hover{color:var(--accent)}
.count{font-size:13px;color:var(--muted);margin-top:14px}
.hint{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:4px}
.person{text-align:left;padding:14px 16px;border-radius:12px;background:var(--surface);position:relative;overflow:hidden}
.person.done{color:var(--muted);border-style:dashed}
.person.done::after{content:"✓";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:13px}
.actions{display:flex;gap:8px;justify-content:center;margin-top:28px;flex-wrap:wrap}

.overlay{
  position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;
  padding:20px;z-index:50;
}
.overlay.on{display:flex}
.stage{width:100%;max-width:360px;text-align:center}
.stage p.who{font-family:"Fraunces",Georgia,serif;font-size:19px;margin:0 0 18px;line-height:1.35}
.flip{perspective:1400px;width:100%;aspect-ratio:3/4;max-height:62vh;margin:0 auto;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .75s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;
}
.front{background:var(--surface)}
.front .mark{font-size:34px}
.front span{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.back{background:var(--accent-soft);border-color:var(--accent);transform:rotateY(180deg)}
.back small{color:var(--muted);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.back strong{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(24px,7vw,34px);line-height:1.15;color:var(--accent);word-break:break-word}
.stage .close{margin-top:22px}
.err{color:var(--accent);font-size:13px;margin-top:12px;min-height:1px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Amigo Secreto</h1>
    <p class="sub">Un solo círculo. Nadie queda en subgrupos.</p>
  </header>

  <section id="setup">
    <div class="card">
      <label for="bulk">Pega la lista (uno por línea o separados por comas)</label>
      <textarea id="bulk" placeholder="Juan&#10;María&#10;Carlos"></textarea>
      <div class="row">
        <input type="text" id="single" placeholder="Agregar un nombre…" autocomplete="off">
        <button id="add">Agregar</button>
      </div>
      <p class="hint">También puedes pegar el bloque completo y presionar Agregar.</p>
      <div class="chips" id="chips"></div>
      <p class="count" id="count">0 participantes</p>
      <button class="primary" id="draw" disabled>Realizar sorteo</button>
      <p class="err" id="err"></p>
    </div>
  </section>

  <section id="reveal" class="hidden">
    <div class="card">
      <label>Toca tu nombre para ver a quién te tocó</label>
      <div class="people" id="people"></div>
    </div>
    <div class="actions">
      <button class="ghost" id="again">Nuevo sorteo</button>
      <button class="ghost" id="edit">Editar lista</button>
    </div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="stage">
    <p class="who" id="who"></p>
    <div class="flip" id="flip">
      <div class="inner">
        <div class="face front">
          <div class="mark">🎁</div>
          <span>Toca para voltear</span>
        </div>
        <div class="face back">
          <small>Tu amigo secreto es</small>
          <strong id="target"></strong>
        </div>
      </div>
    </div>
    <button class="close" id="close">Cerrar</button>
  </div>
</div>

<script>
(function(){
  var names = [], pairs = null, revealed = {};
  var $ = function(id){ return document.getElementById(id); };

  function save(){
    try{ localStorage.setItem('as_state', JSON.stringify({names:names,pairs:pairs,revealed:revealed})); }catch(e){}
  }
  function load(){
    try{
      var s = JSON.parse(localStorage.getItem('as_state')||'null');
      if(s && Array.isArray(s.names)){ names=s.names; pairs=s.pairs||null; revealed=s.revealed||{}; }
    }catch(e){}
  }

  function norm(s){ return s.replace(/\s+/g,' ').trim(); }

  function addMany(text){
    var parts = text.split(/[\n,;]+/).map(norm).filter(Boolean);
    var added = 0;
    parts.forEach(function(p){
      var dup = names.some(function(n){ return n.toLowerCase() === p.toLowerCase(); });
      if(!dup){ names.push(p); added++; }
    });
    return added;
  }

  function renderChips(){
    var c = $('chips'); c.innerHTML = '';
    names.forEach(function(n,i){
      var el = document.createElement('span');
      el.className = 'chip';
      el.textContent = n;
      var b = document.createElement('button');
      b.textContent = '×';
      b.title = 'Quitar';
      b.onclick = function(){ names.splice(i,1); renderChips(); save(); };
      el.appendChild(b);
      c.appendChild(el);
    });
    $('count').textContent = names.length + (names.length===1?' participante':' participantes');
    $('draw').disabled = names.length < 3;
  }

  // Fisher-Yates + anillo => una sola ronda cerrada, sin subgrupos
  function drawRing(list){
    var a = list.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    var map = {};
    for(var k=0;k<a.length;k++) map[a[k]] = a[(k+1)%a.length];
    return map;
  }

  function renderPeople(){
    var p = $('people'); p.innerHTML = '';
    names.forEach(function(n){
      var b = document.createElement('button');
      b.className = 'person' + (revealed[n] ? ' done' : '');
      b.textContent = n;
      b.onclick = function(){ open(n); };
      p.appendChild(b);
    });
  }

  function open(n){
    $('who').textContent = n + ', este es tu amigo secreto…';
    $('target').textContent = pairs[n];
    $('flip').classList.remove('flipped');
    $('overlay').classList.add('on');
  }

  $('flip').onclick = function(){
    var f = $('flip');
    if(!f.classList.contains('flipped')){
      f.classList.add('flipped');
      var n = $('who').textContent.split(',')[0];
      revealed[n] = true; save(); renderPeople();
    }
  };
  $('close').onclick = function(){ $('overlay').classList.remove('on'); };
  $('overlay').onclick = function(e){ if(e.target === $('overlay')) $('overlay').classList.remove('on'); };

  $('add').onclick = function(){
    var n = addMany($('bulk').value + '\n' + $('single').value);
    $('bulk').value = ''; $('single').value = '';
    $('err').textContent = n ? '' : 'No se agregaron nombres nuevos.';
    renderChips(); save();
  };
  $('single').addEventListener('keydown', function(e){ if(e.key==='Enter') $('add').click(); });
  $('bulk').addEventListener('blur', function(){ if($('bulk').value.trim()){ $('add').click(); } });

  $('draw').onclick = function(){
    if(names.length < 3){ $('err').textContent='Se necesitan al menos 3 participantes.'; return; }
    pairs = drawRing(names); revealed = {}; save();
    $('setup').classList.add('hidden'); $('reveal').classList.remove('hidden');
    renderPeople(); window.scrollTo(0,0);
  };
  $('again').onclick = function(){
    pairs = drawRing(names); revealed = {}; save(); renderPeople();
  };
  $('edit').onclick = function(){
    $('reveal').classList.add('hidden'); $('setup').classList.remove('hidden');
    pairs = null; revealed = {}; save(); renderChips();
  };

  load();
  renderChips();
  if(pairs){
    $('setup').classList.add('hidden'); $('reveal').classList.remove('hidden'); renderPeople();
  }
})();
</script>
</body>
</html>
